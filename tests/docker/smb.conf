[global]
   workgroup = TESTGROUP
   server string = Test SMB Server
   security = user
   map to guest = never
   log level = 1
   server min protocol = SMB2
   server max protocol = SMB3
   passdb backend = tdbsam:/var/lib/samba/private/passdb.tdb

[testshare]
   path = /home/smbuser/share
   browseable = yes
   read only = no
   valid users = smbuser
   create mask = 0644
   directory mask = 0755

# A DFS root for SmbSession.dfs_referrals (tests/test_smb_acl_dfs.py):
# the link "docs" points at testshare twice (two targets).
[dfsroot]
   path = /srv/dfsroot
   msdfs root = yes
   read only = yes
   valid users = smbuser
