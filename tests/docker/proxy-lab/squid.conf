# Proxy lab squid: three listeners, no caching, no destination limits
# (the lab network is the only thing behind it).
http_port 3128
https_port 3129 tls-cert=/certs/proxy.crt tls-key=/certs/proxy.key
http_port 3130

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/htpasswd
auth_param basic realm axross-lab
auth_param ntlm program /usr/lib/squid/ntlm_fake_auth
auth_param ntlm children 5

acl openport localport 3130
acl authed proxy_auth REQUIRED

http_access allow openport
http_access allow authed
http_access deny all

cache deny all
visible_hostname axproxy-squid
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
coredump_dir /tmp
