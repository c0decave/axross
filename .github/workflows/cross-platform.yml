# axross on Linux, macOS and Windows: the smoke tests in a fresh install.
# tests/test_cross_platform_smoke.py opens the main window, lists a folder
# and runs a command in a local terminal; tests/test_windows_import_surface.py
# imports the GUI without the Unix-only standard modules.
name: Cross-platform

on:
  push:
    branches: [ "main", "ci/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Qt runtime libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install axross
      run: |
        python -m pip install --upgrade pip
        python -m pip install . pytest
    - name: Smoke tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m pytest -v tests/test_cross_platform_smoke.py tests/test_windows_import_surface.py tests/test_terminal_winpty.py

  # One-file binaries for macOS and Windows (the Linux ones are built in the
  # AlmaLinux 9 builder image, for the oldest glibc). Unsigned: Gatekeeper
  # and SmartScreen warn on first start.
  bundle:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Install the locked build dependencies
      # The hashed lock the Linux bundles are built from (Dockerfile.build):
      # one exact version and the sha256 of every file per package; a file
      # that differs stops the build. pip and setuptools first (the same two
      # entries), then the lock; adb-shell and manuf publish no Python 3 wheel
      # and are built against the hashed setuptools, without fetching a
      # build backend.
      # The spec builds from the checkout, so axross itself is not installed.
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r build/requirements-bootstrap.txt
        python -m pip install --require-hashes --only-binary=:all: --no-binary=adb-shell,manuf --no-build-isolation -r build/requirements-bundle.txt
    - name: Build axross-slim
      env:
        AXROSS_BUNDLE_FLAVOR: slim
      run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build-work build/axross.spec
    - name: Smoke-test the binary
      env:
        QT_QPA_PLATFORM: offscreen
      run: python scripts/bundle_smoke.py dist
    - name: Open the main window on the native platform
      # Cocoa on macOS, the desktop on Windows: the checks above never open
      # a window, so a crash on the way to it passed every run before.
      run: python scripts/bundle_smoke.py --native dist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: axross-slim-${{ runner.os }}-${{ runner.arch }}
        path: dist/axross-slim*
        if-no-files-found: error
