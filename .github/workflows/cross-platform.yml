# axross on Linux, macOS and Windows: the smoke tests in a fresh install.
# tests/test_cross_platform_smoke.py opens the main window, lists a folder
# and runs a command in a local terminal; tests/test_windows_import_surface.py
# imports the GUI without the Unix-only standard modules.
name: Cross-platform

on:
  push:
    branches: [ "main", "ci/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Qt runtime libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install axross
      run: |
        python -m pip install --upgrade pip
        python -m pip install . pytest
    - name: Smoke tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m pytest -v tests/test_cross_platform_smoke.py tests/test_windows_import_surface.py tests/test_terminal_winpty.py

  # One-file binaries for macOS and Windows, slim and full (the Linux ones:
  # the linux job below, scripts/build_dist.sh). Unsigned:
  # Gatekeeper and SmartScreen warn on first start. full carries what the
  # lock installs on the platform (the cloud SDKs, numpy for the Media
  # Player and the Bluetooth streams, Bumble for a Bluetooth stick used
  # directly); voice and analysis are Linux only (their lock markers).
  bundle:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
        flavor: [ slim, full ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Install the locked build dependencies
      # The hashed lock the Linux bundles are built from (Dockerfile.build):
      # one exact version and the sha256 of every file per package; a file
      # that differs stops the build. pip and setuptools first (the same two
      # entries), then the lock; adb-shell and manuf publish no Python 3 wheel
      # and are built against the hashed setuptools, without fetching a
      # build backend.
      # The spec builds from the checkout, so axross itself is not installed.
      run: |
        python -m pip install --require-hashes --only-binary=:all: -r build/requirements-bootstrap.txt
        python -m pip install --require-hashes --only-binary=:all: --no-binary=adb-shell,manuf --no-build-isolation -r build/requirements-bundle.txt
    - name: Build axross-${{ matrix.flavor }}
      env:
        AXROSS_BUNDLE_FLAVOR: ${{ matrix.flavor }}
      # one folder per flavour: bundle_smoke.py takes the binary it finds there
      run: python -m PyInstaller --clean --noconfirm --distpath dist/${{ matrix.flavor }} --workpath build-work build/axross.spec
    - name: Smoke-test the binary
      env:
        QT_QPA_PLATFORM: offscreen
      run: python scripts/bundle_smoke.py dist/${{ matrix.flavor }}
    - name: Open the main window on the native platform
      # Cocoa on macOS, the desktop on Windows: the checks above never open
      # a window, so a crash on the way to it passed every run before.
      run: python scripts/bundle_smoke.py --native dist/${{ matrix.flavor }}
    - name: Checksum
      # SHA-256 next to the binary (the format of sha256sum), for the release's SHA256SUMS
      run: python -c "import hashlib,pathlib;[pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n') for p in pathlib.Path('dist/${{ matrix.flavor }}').glob('axross-*') if p.suffix!='.sha256']"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: axross-${{ matrix.flavor }}-${{ runner.os }}-${{ runner.arch }}
        path: dist/${{ matrix.flavor }}/axross-${{ matrix.flavor }}*
        if-no-files-found: error

  # Everything a release carries for Linux, built by scripts/build_dist.sh
  # itself - the builder machine's script, unchanged: the supply-chain gate
  # first (every lock against PyPI, OSV, age, provenance and the reviewed
  # baseline; the scanners; the venvs against their locks; the system
  # packages), then glibc-2.34/ (AlmaLinux 9 libraries) and glibc-2.36/
  # (Debian 12 libraries) with axross-{base,slim,full} and the tools
  # axross-{media-player,system-info}, standalone/, packs/ with
  # packs-<version>.json, the wheel, the sdist, SUPPLY-CHAIN.md and
  # BUILD-INFO.md. No container: build_dist.sh fetches each target's
  # packages (build/sysroot/<system>.txt, signatures and hashes checked)
  # and builds against only those, so the binaries are the same wherever
  # it runs. Only on a release tag, a ci/ branch or by hand: it takes hours.
  # No secret, no key: SHA256SUMS is signed on the maintainer's machine
  # (scripts/assemble_release.py with the release key), never here.
  linux:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/ci/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      # build_dist.sh needs uv (it fetches CPython from python-build-standalone,
      # hash-checked by uv): the release archive, its SHA-256 pinned here
      UV_VERSION: "0.13.5"
      UV_SHA256: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # the build runs the locked packages' code: no token left in .git/config
        persist-credentials: false
    - name: The builder's tools
      # what build_dist.sh names: git, curl, gpgv, dpkg-deb (the runner's), uv
      run: |
        for tool in git curl gpgv dpkg-deb python3 sha256sum; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing"; exit 1; }
        done
        # sysroot_fetch.py checks Debian's Release files against Debian's keys
        # (/usr/share/keyrings): Ubuntu's signed package of them, not on the runner
        sudo apt-get install -y -q --no-install-recommends debian-archive-keyring
        ls /usr/share/keyrings/debian-archive-keyring.gpg
        curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
        echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/uv"
        tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP/uv" --strip-components=1
        echo "$RUNNER_TEMP/uv" >> "$GITHUB_PATH"
    - name: A work folder on the larger disk
      # the venvs, both sysroots and PyInstaller's scratch: many GB, on disk
      run: |
        work="$RUNNER_TEMP/dist-work"
        if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail "$RUNNER_TEMP" | tail -1)" ]; then
            sudo mkdir -p /mnt/axross-dist-work
            sudo chown "$(id -u):$(id -g)" /mnt/axross-dist-work
            work=/mnt/axross-dist-work
        fi
        echo "AXROSS_DIST_WORK=$work" >> "$GITHUB_ENV"
        df -h "$RUNNER_TEMP" /mnt || true
    - name: Build the Linux dist (scripts/build_dist.sh, the supply-chain gate first)
      run: |
        set -o pipefail
        scripts/build_dist.sh --out dist/linux --work "$AXROSS_DIST_WORK" 2>&1 | tee "$RUNNER_TEMP/build_dist.log"
    - name: The end of the build log as an annotation
      # the API serves annotations where the log storage is out of reach
      # (a sandboxed maintainer's machine): gh api .../check-runs/JOB/annotations
      if: failure()
      run: |
        [ -f "$RUNNER_TEMP/build_dist.log" ] || exit 0
        tail -n 80 "$RUNNER_TEMP/build_dist.log" | python3 -I -c '
        import re, sys
        text = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", sys.stdin.read())[-3800:]
        text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
        print("::error title=build_dist.sh (last lines)::" + text)'
    - name: The native components of the release notes
      run: |
        python3 -I scripts/native_inventory.py dist/linux/glibc-2.34/axross-full \
            dist/linux/glibc-2.34/axross-slim --notes dist/linux/NATIVE-COMPONENTS.md
    - name: THIRD_PARTY_LICENSES.md names the native files of these binaries
      id: inventory
      run: |
        python3 -I scripts/native_inventory.py dist/linux/glibc-2.34/axross-full \
            dist/linux/glibc-2.34/axross-slim --check
    - name: THIRD_PARTY_LICENSES.md as these binaries want it (to commit)
      if: failure() && steps.inventory.outcome == 'failure'
      run: |
        python3 -I scripts/native_inventory.py dist/linux/glibc-2.34/axross-full \
            dist/linux/glibc-2.34/axross-slim --write || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure() && steps.inventory.outcome == 'failure'
      with:
        name: axross-linux-third-party-licenses
        path: THIRD_PARTY_LICENSES.md
    - name: assemble_release.py takes the folder
      # the maintainer's step, without the key and the macOS / Windows binaries
      run: python3 -I scripts/assemble_release.py --dist dist/linux --out "$RUNNER_TEMP/assembled"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # build_dist.sh's dist/<version>/: gh run download -n axross-linux-dist
        # -D dist/<version> puts it back where the builder writes it
        name: axross-linux-dist
        path: dist/linux/
        if-no-files-found: error

  # The Linux binaries against a current host (docs/PACKAGING.md, release
  # flow): host programs started from the binary, host plugin libraries
  # loaded into it, an OpenGL context. A job of its own: pytest and the
  # control's PyQt6 are installed from PyPI unpinned (what a pip user
  # gets), so they never share a runner with the build.
  linux-host-check:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        flavor: [ full, slim, base ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Host programs and libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 xvfb ffmpeg rsync file
    - name: Install pytest and the control's PyQt6
      run: |
        python -m pip install --upgrade pip
        python -m pip install . pytest
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: axross-linux-dist
        path: dist/linux
    - name: axross-${{ matrix.flavor }} (glibc-2.34) against this host
      env:
        AXROSS_FROZEN_BINARY: dist/linux/glibc-2.34/axross-${{ matrix.flavor }}
      # an artifact keeps no file mode
      run: |
        chmod +x "$AXROSS_FROZEN_BINARY"
        python -m pytest -v -rs tests/test_frozen_binary_host_e2e.py
