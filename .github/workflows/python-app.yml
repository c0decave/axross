# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Qt runtime libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest "tomli; python_version < '3.11'"
        pip install .
    - name: Lint with flake8
      run: |
        # Syntax errors and undefined names stop the build - on 3.10, the
        # oldest Python axross supports. resources/scripts/ get ``axross``
        # injected by the script runner, as the ruff config in pyproject says.
        flake8 . --count --select=E9,F63,F7,F82 --extend-exclude=build/lib,dist --per-file-ignores="resources/scripts/*.py:F821" --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --extend-exclude=build/lib,dist --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        # The full suite needs the protocol lab (tests/docker); this job runs
        # what a plain install must pass on the oldest supported Python.
        pytest -q tests/test_cross_platform_smoke.py tests/test_windows_import_surface.py tests/test_terminal_winpty.py tests/test_readme_front_page.py tests/test_pypi_packaging.py
