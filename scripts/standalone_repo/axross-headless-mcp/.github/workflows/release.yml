# A tag vX.Y.Z makes the GitHub release: sdist and wheel (the files that are
# on PyPI are built from axross's tag the same way), SHA256SUMS and notes from
# CHANGELOG.md. The container image ghcr.io/c0decave/axross-headless-mcp and
# the entry io.github.c0decave/axross-headless-mcp in the official MCP
# Registry come from axross's own release workflow (.github/workflows/
# mcp-release.yml in c0decave/axross). Every action is pinned by its commit;
# only the release job may write (contents: write), with the workflow's token.
# The heavy steps write their output to $RUNNER_TEMP/job.log as well; a
# failed job shows the log's last lines as annotations
# (packaging/ci_log_tail.py), readable through the API without the logs.
name: release

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: The tag names this version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
        [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
        grep -q "^## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
        head -n 1 README.md | grep -qx '<!-- mcp-name: io.github.c0decave/axross-headless-mcp -->' \
            || { echo "::error::README.md lacks the mcp-name line"; exit 1; }
    - name: sdist and wheel
      run: |
        set -o pipefail
        {
          python -m pip install build twine
          python -m build --outdir release/
          python -m twine check --strict release/*
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: The wheel installed, without Qt, against its own tests
      run: |
        set -o pipefail
        {
          python -m venv "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check/bin/pip" install release/*.whl
          "$RUNNER_TEMP/check/bin/pip" install pytest
          "$RUNNER_TEMP/check/bin/axross-headless-mcp" --version
          "$RUNNER_TEMP/check/bin/python" -c 'import importlib.util as u, sys; sys.exit(u.find_spec("PyQt6") is not None)'
          "$RUNNER_TEMP/check/bin/python" -m pytest -q -rfE tests
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: The end of the job's log as annotations
      if: failure()
      run: python packaging/ci_log_tail.py "$RUNNER_TEMP/job.log" "python job"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python
        path: release/
        if-no-files-found: error

  release:
    needs: [ python ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifacts
    - name: SHA256SUMS and the notes
      run: |
        set -o pipefail
        {
          mkdir assets
          find artifacts -type f -exec cp {} assets/ \;
          (cd assets && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS assets/
          cat assets/SHA256SUMS
          python3 packaging/release_notes.py "$GITHUB_REF_NAME" assets > notes.md
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: The GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "axross-headless-mcp ${GITHUB_REF_NAME#v}" --notes-file notes.md assets/* \
            2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: The end of the job's log as annotations
      if: failure()
      run: python3 packaging/ci_log_tail.py "$RUNNER_TEMP/job.log" "release job"
