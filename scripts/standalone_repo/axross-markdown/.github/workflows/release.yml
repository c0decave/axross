# A tag vX.Y.Z makes the GitHub release: sdist and wheel, one-file programs
# for Linux (also as an AppImage), macOS arm64 (also as a disk image with an
# app) and Windows x64, their licences (LICENSE, NOTICE and
# THIRD_PARTY_LICENSES.txt: the binaries contain PyQt6 and Qt and are GPL-3.0
# combined works), SHA256SUMS, and notes from CHANGELOG.md. Every action
# is pinned by its commit; the dependencies come from the hashed locks
# (requirements.lock.txt, packaging/requirements-pyinstaller.txt - wheels
# only, --only-binary=:all: - no sdist built with unhashed build tools), and so do
# the tools that build the sdist and wheel (packaging/requirements-build.txt:
# build and twine; the backend, setuptools, from requirements.lock.txt -
# --no-isolation, nothing unpinned from PyPI) and the tests' pytest
# (packaging/requirements-test.txt); the sdist and wheel are built before
# any test tool is installed. Only the
# release job may write (contents: write; id-token and attestations for
# the provenance), with the workflow's own token.
# The heavy steps write their output to $RUNNER_TEMP/job.log as well; a
# failed job shows the log's last lines as annotations
# (packaging/ci_log_tail.py), readable through the API without the logs.
# Nothing is built before axross's supply-chain gate and the tests
# (tests.yml, called as a reusable workflow) pass.
# Every asset (SHA256SUMS too) gets GitHub's build provenance attestation
# (actions/attest-build-provenance: this workflow, this tag, GitHub's runner).
# The release is made as a draft: the maintainer signs its SHA256SUMS on
# their own machine and publishes it (scripts/sign_release.py release vX.Y.Z
# --key KEY --publish - the key never comes near CI; it signs nothing whose
# attestation gh attestation verify does not find). Beside each program
# goes the same file under a name with its version (axross-markdown-X.Y.Z-
# linux-x86_64, -x86_64.AppImage, -macos-arm64, -windows-x64.exe,
# axross-mdcat-X.Y.Z-windows-x64.exe): the ones the updater fetches
# (core/markdown_update.py) - an older release's file never stands for a
# newer one - bare programs, no archive.
name: release

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The supply-chain gate on requirements.lock.txt and
  # packaging/requirements-pyinstaller.txt (supply-chain-gate.toml), then the tests (tests.yml):
  # no job below starts before both pass. The blocking tests only: those that pass
  # or fail by elapsed time (the marker timing, tests/markdown_timing.py) run in
  # tests.yml's job timing on every push, and block nothing - a release never
  # waits for them.
  ci:
    uses: ./.github/workflows/tests.yml
    with:
      blocking_only: true

  python:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: The tag names this version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
        [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
        grep -q "^## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
    - name: Qt's system libraries
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libpulse0
    - name: sdist and wheel
      run: |
        set -o pipefail
        {
          # (build and twine hashed - packaging/requirements-build.txt, scripts/lock_standalone_deps.sh -, the
          # backend not fetched: --no-isolation builds with the setuptools of requirements.lock.txt; built before
          # any test tool is in the environment)
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock.txt
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-build.txt
          # (the sdist the same bytes for the same commit: its files' times the commit's, in a fixed order -
          # packaging/reproducible_sdist.py; the wheel is reproducible already)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build --no-isolation --outdir release/
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python packaging/reproducible_sdist.py release/*.tar.gz
          python -m twine check --strict release/*
          # (the sdist holds what THIRD_PARTY_LICENSES.txt says it holds: the build's scripts and locks)
          python packaging/reproducible_sdist.py --check release/*.tar.gz
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: Tests of the built wheel against the locked dependencies
      env:
        QT_QPA_PLATFORM: offscreen
        # (the tests import the installed wheel, not this checkout's src/: tests/conftest.py)
        AXROSS_MARKDOWN_TEST_INSTALLED: "1"
      run: |
        set -o pipefail
        {
          # (pytest and its dependencies hashed as well: packaging/requirements-test.txt)
          python -m pip install --no-deps release/*.whl
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-test.txt
          python -m pytest -q -rfE -m "not timing" tests  # (the timing ones: tests.yml's job timing)
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: The end of the job's log as annotations
      if: failure()
      run: python packaging/ci_log_tail.py "$RUNNER_TEMP/job.log" "python job"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python
        path: release/
        if-no-files-found: error

  binaries:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-22.04      # glibc 2.35: runs on Ubuntu 22.04, Debian 12 and newer
          suffix: linux-x86_64
        - os: macos-latest
          suffix: macos-arm64
        - os: windows-latest
          suffix: windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Qt's system libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libpulse0 file
    - name: The locked dependencies and PyInstaller
      run: |
        set -o pipefail
        {
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock.txt -r packaging/requirements-pyinstaller.txt
          python -m pip install --no-build-isolation --no-deps .
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: One-file binary (PyInstaller)
      run: |
        set -o pipefail
        {
          python -m PyInstaller --clean --noconfirm --distpath build/dist --workpath build/work packaging/axross-markdown.spec
          mkdir -p release
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          case "${{ runner.os }}" in
            Windows) cp build/dist/axross-markdown.exe "release/axross-markdown-${{ matrix.suffix }}"
                     cp build/dist/axross-mdcat.exe "release/axross-mdcat-${{ matrix.suffix }}"
                     # (the files the updater fetches: the version in their names)
                     cp build/dist/axross-markdown.exe "release/axross-markdown-${version}-${{ matrix.suffix }}"
                     cp build/dist/axross-mdcat.exe "release/axross-mdcat-${version}-${{ matrix.suffix }}" ;;
            *) cp build/dist/axross-markdown "release/axross-markdown-${{ matrix.suffix }}"
               cp build/dist/axross-markdown "release/axross-markdown-${version}-${{ matrix.suffix }}" ;;
          esac
          if [ "${{ runner.os }}" = "Linux" ]; then
            # (the build machine's libraries in the program: each, its package's licence, its source package -
            # packaging/system_libraries.py - beside the binaries too)
            { cat build/system-licences/INDEX.txt
              for text in build/system-licences/*.copyright; do
                printf '\n%s\n%s\n\n' "==== licenses/system/$(basename "$text")" "===="; cat "$text"
              done; } > "release/SYSTEM-LIBRARIES-${{ matrix.suffix }}.txt"
          fi
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: Smoke tests (--version, --html, an SVG drawn by --svg-worker; on Linux --term and the window)
      env:
        QT_QPA_PLATFORM: offscreen
        AXROSS_SMOKE_MS: "2000"
      run: |
        set -o pipefail
        {
          bin="release/axross-markdown-${{ matrix.suffix }}"
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          got=$("$bin" --version | tail -n 1 | tr -d '\r')
          [ "$got" = "axross-markdown $version" ] || { echo "::error::--version says '$got'"; exit 1; }
          # (what the updater runs a downloaded program with before it replaces the one running)
          got=$("release/axross-markdown-${version}-${{ matrix.suffix }}" --self-test | tail -n 1 | tr -d '\r')
          [ "$got" = "axross-markdown $version ok" ] || { echo "::error::--self-test says '$got'"; exit 1; }
          printf '# Smoke\n\n| a | b |\n|---|---|\n| 1 | 2 |\n\n```python\nprint(1)\n```\n' > smoke.md
          "$bin" --html smoke.md > smoke.html
          grep -q '<table' smoke.html || { echo "::error::--html wrote no table"; exit 1; }
          # An SVG drawn as the window draws one: in a child the binary starts as itself with
          # --svg-worker (core.svg_worker) - the frozen path, its bootloader in between.
          AXROSS_BUNDLE_SMOKE=1 "$bin" --script packaging/svg_check.py > svg.txt
          grep -q 'svg drawn' svg.txt || { echo "::error::no SVG drawn through --svg-worker"; exit 1; }
          # The other children it starts as itself: --lex-worker (a YAML and a Python block, their
          # colours asserted) and --image-worker (a PNG decoded).
          AXROSS_BUNDLE_SMOKE=1 "$bin" --script packaging/children_check.py > children.txt
          grep -q 'children checked' children.txt || { echo "::error::a child of the binary failed"; cat children.txt; exit 1; }
          # The licences inside it, as Help > About reads them (THIRD_PARTY_LICENSES.txt: PyQt6's GPL-3.0,
          # Qt's LGPL-3.0, the source code) and the interpreter's LICENSE.txt.
          AXROSS_BUNDLE_SMOKE=1 "$bin" --script packaging/licences_check.py > licences.txt
          grep -q 'licences carried' licences.txt || { echo "::error::the binary does not carry its licences"; cat licences.txt; exit 1; }
          # The terminal view colours code through its own lexing child (a 24-bit colour code in the output).
          printf '```yaml\nname: build\nretries: 3\n```\n' > yaml.md
          if [ "${{ runner.os }}" = "Windows" ]; then
            # (the window program opens no console there: the terminal view is axross-mdcat.exe)
            # (the updater runs a downloaded axross-mdcat.exe so before it replaces the one running)
            got=$("release/axross-mdcat-${version}-${{ matrix.suffix }}" --self-test | tail -n 1 | tr -d '\r')
            [ "$got" = "axross-mdcat $version ok" ] || { echo "::error::axross-mdcat.exe --self-test says '$got'"; exit 1; }
            "release/axross-mdcat-${{ matrix.suffix }}" --no-pager --color never smoke.md > mdcat.txt
            grep -q 'Smoke' mdcat.txt || { echo "::error::axross-mdcat.exe wrote no heading"; exit 1; }
            "release/axross-mdcat-${{ matrix.suffix }}" --no-pager --color truecolor yaml.md > yaml.txt
          else
            "$bin" --term --no-pager --color truecolor yaml.md > yaml.txt
          fi
          grep -q $'\x1b\\[38;2;' yaml.txt || { echo "::error::YAML not coloured by the terminal view's --lex-worker"; exit 1; }
          if [ "${{ runner.os }}" = "Linux" ]; then
            "$bin" --term --no-pager --color never smoke.md > smoke.txt
            grep -q 'Smoke' smoke.txt || { echo "::error::--term wrote no heading"; exit 1; }
            HOME="$RUNNER_TEMP/home" "$bin" smoke.md
          fi
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: AppImage (Linux)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        set -o pipefail
        {
          bash packaging/build_appimage.sh release/axross-markdown-linux-x86_64 release/axross-markdown-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./release/axross-markdown-x86_64.AppImage --version
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          cp release/axross-markdown-x86_64.AppImage "release/axross-markdown-${version}-x86_64.AppImage"
          got=$(APPIMAGE_EXTRACT_AND_RUN=1 "./release/axross-markdown-${version}-x86_64.AppImage" --self-test | tail -n 1)
          [ "$got" = "axross-markdown $version ok" ] || { echo "::error::the AppImage's --self-test says '$got'"; exit 1; }
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: Disk image with the app (macOS)
      if: runner.os == 'macOS'
      run: |
        set -o pipefail
        bash packaging/build_macos_dmg.sh release/axross-markdown-macos-arm64 release/axross-markdown-macos-arm64.dmg \
            2>&1 | tee -a "$RUNNER_TEMP/job.log"
    - name: The end of the job's log as annotations
      if: failure()
      run: python packaging/ci_log_tail.py "$RUNNER_TEMP/job.log" "binaries ${{ matrix.suffix }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: binaries-${{ matrix.suffix }}
        path: release/
        if-no-files-found: error

  release:
    needs: [ python, binaries ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # (the build provenance attestation: a Sigstore certificate for this workflow run, stored with GitHub)
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: artifacts
        # (this workflow's own: tests.yml's supply-chain report is no asset of the release)
        pattern: "{python,binaries-*}"
        merge-multiple: true
    - name: SHA256SUMS and the notes
      run: |
        set -o pipefail
        {
          mkdir assets
          find artifacts -type f -exec cp {} assets/ \;
          # (the binaries are GPL-3.0 combined works: their licences and where the source code is, beside them)
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.txt assets/
          (cd assets && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS assets/
          cat assets/SHA256SUMS
          python3 packaging/release_notes.py "$GITHUB_REF_NAME" assets > notes.md
        } 2>&1 | tee -a "$RUNNER_TEMP/job.log"
    # (each asset's SHA-256 bound to this repository, this workflow and this tag: scripts/sign_release.py
    # checks it with gh attestation verify before it signs SHA256SUMS)
    - name: Build provenance of every asset
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: assets/*
    # (a draft: signed and published by hand - scripts/sign_release.py)
    - name: The GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -o pipefail
        gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "axross-markdown ${GITHUB_REF_NAME#v}" --notes-file notes.md assets/* \
            2>&1 | tee -a "$RUNNER_TEMP/job.log"
        echo "::notice::draft $GITHUB_REF_NAME made: sign SHA256SUMS (SHA256SUMS.sig) and publish it with scripts/sign_release.py release $GITHUB_REF_NAME --key KEY --publish"
    - name: The end of the job's log as annotations
      if: failure()
      run: python3 packaging/ci_log_tail.py "$RUNNER_TEMP/job.log" "release job"
