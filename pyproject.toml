[build-system]
requires = ["setuptools>=84.1.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "axross"
description = "A multi-protocol file manager, scripting surface, and MCP server built with PyQt6, for Linux, macOS and Windows"
readme = { file = "README_PYPI.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Marco Lux", email = "mlux@undisclose.de" },
]
keywords = [
    "file-manager",
    "sftp",
    "smb",
    "webdav",
    "s3",
    "mcp",
    "multi-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
# Floors are security boundaries, not style: ``>=X`` tells a consumer's
# resolver that X is acceptable, so any advisory fixed after X stays
# reachable for anyone with a pinned lockfile, an old index mirror, or a
# co-dependency that drags the resolution downwards. Every floor below
# is at or above the highest known fix for that distribution.
# Verify with: python -m security.dep_floor_audit
dependencies = [
    # <6.12: PyQt6 6.12's wheels carry no QtPdf any more (the PDF viewer);
    # Riverbank ships it as the separate PyQt6-Pdf, first released on
    # 2026-11-02. The cap goes once the bundle lock moves to 6.12 together
    # with PyQt6-Pdf.
    "PyQt6>=6.6,<6.12",
    "paramiko>=5.0,<6.0",
    "PySocks>=1.7",
    "keyring>=25.0",
    # 41 advisories affect 12.3.0; 13.0.0 is the first release free of
    # them. It needs Python >= 3.11 - and 3.10 reached its end of life on
    # 2026-10-01 (no security fixes of its own any more), so axross needs
    # 3.11 too. The bundles pin it as well (build/requirements-bundle.txt).
    "Pillow>=13.0.0",
    # Syntax highlighting in the text editor (ui/code_editor.py imports it
    # unguarded). 2.20.0 is the lowest release free of known advisories.
    "Pygments>=2.20.0",
    # The encrypted overlay and certificate inspection import it directly;
    # paramiko only asks for >=3.3. 50.0.0 clears the known advisories.
    "cryptography>=50.0.0",
    # Local panes see changes at once (inotify / FSEvents /
    # ReadDirectoryChangesW) instead of listing the folder every 2 s
    # (core/watch.py). 6.0.0: no known advisories.
    "watchdog>=6.0.0",
    # The local terminal on Windows (ConPTY); POSIX uses the pty module.
    # 3.1 is the version whose PtyProcess API ui/terminal_widget.py follows.
    'pywinpty>=3.1; sys_platform == "win32"',
]

[project.urls]
Homepage = "https://github.com/c0decave/axross"
Repository = "https://github.com/c0decave/axross"
Issues = "https://github.com/c0decave/axross/issues"
Documentation = "https://github.com/c0decave/axross#readme"

[project.optional-dependencies]
smb = ["smbprotocol>=1.13"]
webdav = ["requests>=2.33.0", "defusedxml>=0.7"]
s3 = ["boto3>=1.28"]
azure = ["azure-storage-blob>=12.19", "azure-storage-file-share>=12.15"]
onedrive = ["msal>=1.26", "requests>=2.33.0"]
gdrive = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.1", "google-auth-httplib2>=0.2"]
dropbox = ["dropbox>=12.0"]
fuse = ["fusepy>=3.0"]
winrm = ["pywinrm>=0.4"]
wmi = ["impacket>=0.11"]
exchange = ["exchangelib>=5.0"]
adb = ["adb-shell>=0.4"]
archive = ["py7zr>=1.1.3", "rarfile>=4.0", "backports.zstd>=1.0; python_version < '3.14'"]
tftp = ["tftpy>=0.8"]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
# 4.18.3: the C BSON decoder no longer over-reads a truncated Regex element
# (GHSA-98qm-wvgf-w4cf); axross decodes what a server sends.
mongo = ["pymongo>=4.18.3"]
# urllib3: core/proxy.py builds the proxied pool manager dulwich talks through.
git = ["dulwich>=1.2.9", "urllib3>=2.8.0"]
# 2.9.0: no CPU exhaustion on a crafted compressed name (GHSA-45c3-73f7-pv4m).
dns = ["dnspython>=2.9.0"]
magic = ["puremagic>=1.20"]
encoding = ["chardet>=5.2"]
snmp = ["pysnmp>=6.2"]
ldap = ["ldap3>=2.9"]
mac = ["manuf>=1.1"]
# Bluetooth panel: a USB stick driven directly, without BlueZ (also Windows,
# macOS) - core/bluetooth_direct.py. An opt-in extra: it takes the stick from
# the operating system while axross uses it.
bluetooth-raw = ["bumble>=0.0.236"]
whois = ["ipwhois>=1.3"]
ntp = ["ntplib>=0.4"]
# Removing PDF metadata (Info dictionary + XMP, full rewrite). Reading works
# without it through QtPdf. Not mutagen: GPL-2.0+ would bind the binary.
# 6.21.4 fixes the parser advisories of 6.21.2 and 6.21.3
# (GHSA-5849-834g-hvw5, GHSA-mfr5-77xh-9j7h, GHSA-cggf-277g-3q54 and four
# fixed in 6.21.3); axross opens untrusted PDFs with it.
metadata = ["pypdf>=6.21.4"]
# File analysis (Analysis dock), an opt-in extra: not part of "all".
sift = ["sift-summarizer>=0.1.86"]
# Media Player extension: equalizer and spectrum (playback works without).
media = ["numpy>=2.0"]
# Talking with the Agent dock: Piper speech output and local faster-whisper
# recognition. An opt-in extra, not part of "all": piper-tts is
# GPL-3.0-or-later. Voices and models are downloaded in Help > Features….
# Chat panels: Matrix with end-to-end encryption (vodozemac), XMPP with OMEMO 2
# (the old OMEMO only if the user installs the AGPL "oldmemo" package). IRC
# needs nothing extra. Opt-in, not part of "all"; bundled in axross-full.
chat = ["matrix-nio[e2e]>=0.26.0", "slixmpp>=1.17.0", "omemo>=2.1.0", "twomemo[xml]>=2.1.0"]
voice = ["piper-tts>=1.8.0", "onnxruntime>=1.31.0", "faster-whisper>=1.2.1", "ctranslate2>=4.8.3"]
all = [
    "smbprotocol>=1.13",
    "defusedxml>=0.7",
    "boto3>=1.28",
    "azure-storage-blob>=12.19",
    "azure-storage-file-share>=12.15",
    "msal>=1.26",
    "requests>=2.33.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.2",
    "dropbox>=12.0",
    "adb-shell>=0.4",
    "py7zr>=1.1.3",
    "rarfile>=4.0",
    "tftpy>=0.8",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pymongo>=4.18.3",
    "dulwich>=1.2.9",
    "urllib3>=2.8.0",
    "dnspython>=2.9.0",
    "puremagic>=1.20",
    "chardet>=5.2",
    "pysnmp>=6.2",
    "ldap3>=2.9",
    "manuf>=1.1",
    "ipwhois>=1.3",
    "ntplib>=0.4",
    "pypdf>=6.21.4",
]

[project.scripts]
axross = "axross.cli:main"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]
packages = [
    "axross",
    "core",
    "security",
    "ui",
    "models",
    "examples",
    "examples.scripting_api",
    "resources",
    "resources.logo",
    "resources.logo.concepts",
    "resources.scripts",
    "resources.extensions",
    "resources.wordlists",
    "resources.voice",
    "resources.mcp",
    "resources.credits",
    "resources.i18n",
    "resources.chat_servers",
]

[tool.setuptools.package-data]
"resources.logo" = ["*.png", "*.svg"]
"resources.logo.concepts" = ["*.svg"]
"resources.scripts" = ["*.md"]
"resources.wordlists" = ["*.txt"]
"resources.voice" = ["*.txt"]
"resources.mcp" = ["*.json"]
"resources.credits" = ["*.json"]
"resources.i18n" = ["*.json"]
"resources.chat_servers" = ["*.json"]
"examples" = ["*.md"]
"examples.scripting_api" = ["*.md"]

[tool.setuptools.dynamic]
version = { attr = "axross._version.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"
# setuptools' build output (a copy of the tree): a build before `ruff check .`
# - as in CI - must not lint it twice.
extend-exclude = ["build/lib"]

[tool.ruff.lint]
# The gate `ruff check .` (CONTRIBUTING.md; the "package" job of
# .github/workflows/python-app.yml): pyflakes (undefined names, unused
# imports and variables, redefinitions), syntax errors, raw bidi
# characters in the source (PLE2502: write them as \u escapes) and an
# exception repeated in the handlers of one try (B025). Line length and
# import order (E501, I001) are not gated: the tree does not meet them yet.
select = ["F", "E9", "PLE2502", "B025"]

[tool.ruff.lint.per-file-ignores]
# Bundled example scripts under resources/scripts/ are exec()-ed inside
# the REPL with ``axross`` injected as a global; static linters can't
# see that binding. Suppress F821 (undefined name) and F401 (unused
# import) for that tree only.
"resources/scripts/*.py" = ["F821", "F401"]
# Tests import pytest fixtures by name and take them as arguments (F811),
# and import modules for what importing them does (F401).
"tests/**/*.py" = ["F811", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]
# /tmp is often a tmpfs (RAM): the tmp_path folders of the last three runs
# held 1.5 GiB of memory. Only a failed test's folder is kept.
tmp_path_retention_policy = "failed"

[tool.mypy]
# We don't gate CI on mypy yet — the codebase has structural typing
# issues (telnet_client._SpooledWriter / _ShellSession mismatches,
# ssh_client._transport None-narrowing, proxy.py return types) that
# would need targeted refactors. This config is for ad-hoc local
# runs; flip ``strict`` per-module when a refactor is in scope.
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
# Bundled example scripts run under exec() with ``axross`` injected
# as a global; mypy can't see that binding.
exclude = ["resources/scripts/", "build/", "dist/"]

[[tool.mypy.overrides]]
# Optional deps with no type stubs — silence the import-not-found
# noise so the substantive errors stand out.
module = [
    "paramiko.*", "dulwich.*", "fuse.*", "psycopg.*",
    "pymongo.*", "redis.*", "smbprotocol.*", "tftpy.*",
    "exchangelib.*", "winrm.*", "impacket.*",
    "google.*", "googleapiclient.*", "msal.*",
    "boto3.*", "botocore.*", "azure.*", "dropbox.*",
    "puremagic", "manuf", "chardet", "pysnmp.*",
    "py7zr", "ldap3.*", "ntplib",
    "PyQt6.*", "PyQt6.uic", "qtawesome.*",
]
ignore_missing_imports = true
